name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Snapshot-only commits are polled via raw.githubusercontent.com — skip full Pages rebuild.
    paths-ignore:
      - 'public/geo/ru-alerts.json'
      - 'public/geo/dsm-ru.json'
      - 'public/geo/warspotting.json'
      - 'public/geo/warspotting-evidence.json'
      - 'public/geo/rf-sightings.json'
      - 'public/geo/geoconfirmed-ground.json'
      - 'public/geo/power-outages.json'
      - 'public/geo/power-tg-outages.json'
      - 'public/geo/rf-aviation.json'
      - 'public/geo/eradar.json'
      - 'public/geo/ua-air-tg.json'
  schedule:
    # Occasional full rebuild so dist/ also embeds recent snapshots.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh Drone Strike Map snapshot
        run: node scripts/refresh-dsm.mjs
        continue-on-error: true
      - name: Refresh RU alert regions snapshot
        run: node scripts/refresh-ru-alerts.mjs
        continue-on-error: true
      - name: Refresh WarSpotting ground losses snapshot
        run: node scripts/refresh-warspotting.mjs
        continue-on-error: true
      - name: Refresh RF ground sightings snapshot
        run: node scripts/refresh-rf-sightings.mjs
        continue-on-error: true
      - name: Refresh GeoConfirmed ground snapshot
        run: node scripts/refresh-geoconfirmed-ground.mjs
        continue-on-error: true
      - name: Refresh power outage schedules snapshot
        run: node scripts/refresh-power-outages.mjs
        continue-on-error: true
      - name: Refresh power TG emergency outages snapshot
        run: node scripts/refresh-power-tg.mjs
        continue-on-error: true
      - name: Refresh RF aviation takeoffs
        run: node scripts/refresh-rf-aviation.mjs
        continue-on-error: true
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /alert-tracker/
          VITE_PUSH_API_BASE: https://alert-tracker-push.azerorh.workers.dev

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
