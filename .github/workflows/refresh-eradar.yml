name: Refresh eRadar snapshot

# Light 15‑min pull — TG danger zones expire fast; full OSINT stays hourly.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-eradar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh eRadar TG danger zones
        run: node scripts/refresh-eradar.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo/eradar.json
          if git diff --staged --quiet; then
            echo "No eRadar changes"
            exit 0
          fi
          git commit -m "chore: refresh eRadar TG danger zones"
          git push
