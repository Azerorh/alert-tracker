name: Refresh air TG zones

# Light 15‑min pull — eRadar dangers + UA monitor place buffers.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-eradar
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh eRadar TG danger zones
        run: node scripts/refresh-eradar.mjs
        continue-on-error: true
      - name: Refresh UA air-monitor TG zones
        run: node scripts/refresh-ua-air-tg.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo/eradar.json public/geo/ua-air-tg.json
          if git diff --staged --quiet; then
            echo "No air TG zone changes"
            exit 0
          fi
          git commit -m "chore: refresh air TG zones (eRadar + UA monitors)"
          git push
