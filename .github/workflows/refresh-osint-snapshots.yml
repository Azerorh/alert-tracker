name: Refresh OSINT snapshots

# Keeps public/geo/*.json fresh for GitHub Pages (no BFF; RU alerts from TG channels).
# Clients poll raw.githubusercontent.com; full site rebuild not required.

on:
  schedule:
    # Hourly full OSINT; eRadar also has a lighter 15‑min workflow.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-osint
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Drone Strike Map snapshot
        run: node scripts/refresh-dsm.mjs
        continue-on-error: true
      - name: Refresh RU alert regions snapshot
        run: node scripts/refresh-ru-alerts.mjs
        continue-on-error: true
      - name: Refresh eRadar TG danger zones snapshot
        run: node scripts/refresh-eradar.mjs
        continue-on-error: true
      - name: Refresh UA air-monitor TG zones snapshot
        run: node scripts/refresh-ua-air-tg.mjs
        continue-on-error: true
      - name: Refresh WarSpotting ground losses snapshot
        run: node scripts/refresh-warspotting.mjs
        continue-on-error: true
      - name: Refresh RF ground sightings snapshot
        run: node scripts/refresh-rf-sightings.mjs
        continue-on-error: true
      - name: Refresh GeoConfirmed ground snapshot
        run: node scripts/refresh-geoconfirmed-ground.mjs
        continue-on-error: true
      - name: Refresh power outage schedules snapshot
        run: node scripts/refresh-power-outages.mjs
        continue-on-error: true
      - name: Refresh power TG emergency outages snapshot
        run: node scripts/refresh-power-tg.mjs
        continue-on-error: true
      - name: Refresh RF aviation takeoffs
        run: node scripts/refresh-rf-aviation.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo/dsm-ru.json public/geo/ru-alerts.json public/geo/eradar.json public/geo/ua-air-tg.json public/geo/rf-aviation.json public/geo/warspotting.json public/geo/warspotting-evidence.json public/geo/rf-sightings.json public/geo/geoconfirmed-ground.json public/geo/power-outages.json public/geo/power-tg-outages.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: refresh OSINT snapshots (RU / eRadar / UA TG / RF aviation / DSM / WarSpotting / sightings / GeoConfirmed / power)"
          git push
