name: Refresh OSINT snapshots

# Keeps public/geo/*.json fresh for GitHub Pages (no BFF; RU alerts from TG channels).
# Clients poll raw.githubusercontent.com; full site rebuild not required.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-osint
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Drone Strike Map snapshot
        run: node scripts/refresh-dsm.mjs
        continue-on-error: true
      - name: Refresh RU alert regions snapshot
        run: node scripts/refresh-ru-alerts.mjs
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/geo/dsm-ru.json public/geo/ru-alerts.json
          if git diff --staged --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: refresh OSINT snapshots (RU alerts / DSM)"
          git push
